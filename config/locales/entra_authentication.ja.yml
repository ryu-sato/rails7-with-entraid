# Entra ID 認証の利用者向け固定文言（日本語）。
# 内部情報（設定値・例外の内容・クレーム等）は含めない。補間（%{...}）も使わない。
ja:
  devise:
    failure:
      # 無操作による失効
      timeout: "しばらく操作がなかったため、セッションの有効期限が切れました。もう一度サインインしてください。"
      # セッションの最大継続時間による失効
      absolute_timeout: "セッションの最大継続時間に達したため、有効期限が切れました。もう一度サインインしてください。"
      unauthenticated: "続けるにはサインインしてください。"
  entra_authentication:
    failures:
      cancelled: "サインインがキャンセルされました。もう一度お試しいただけます。"
      failed: "サインインに失敗しました。しばらくしてからもう一度お試しいただくか、管理者にお問い合わせください。"
      # SignInGate の既定文言（EntraAuth::SignInGate::GENERIC_FAILURE_DEFAULT）と同一
      generic: "サインインに失敗しました。しばらくしてからもう一度お試しください。"
      # ゲートによる拒否で文言が得られない場合の汎用文言
      rejected: "このアカウントではサインインできません。管理者にお問い合わせください。"
