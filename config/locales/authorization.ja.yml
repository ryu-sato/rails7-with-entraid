ja:
  authorization:
    # ロールが原因でサインインを拒否したときに、サインイン画面へ表示する文言。
    # 固定文のみ。クレーム・グループ ID・ロール名を埋め込まない。
    rejections:
      no_roles: "このアプリを利用するための権限がアカウントに割り当てられていないため、サインインできませんでした。管理者にお問い合わせください。"
      groups_overage: "所属しているグループの数が多すぎて利用権限を判定できないため、サインインできませんでした。管理者にお問い合わせください。"
    # サインイン済みの利用者が、許可されていない操作をしたときに表示する文言。
    forbidden:
      title: "この操作を行う権限がありません"
      body: "お使いのアカウントには、このページの表示または操作が許可されていません。必要な場合は管理者にお問い合わせください。"
      back: "トップページへ戻る"
